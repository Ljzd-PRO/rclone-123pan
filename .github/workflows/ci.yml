name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - name: Validate version derivation
        run: ./tools/test-version.sh
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Fuzz strict response envelope
        run: go test ./backend/123pan -run '^$' -fuzz '^FuzzDecodeEnvelope$' -fuzztime=5s
      - name: Fuzz upload part planning
        run: go test ./backend/123pan -run '^$' -fuzz '^FuzzUploadPartCount$' -fuzztime=5s
      - name: Static analysis
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          args: --timeout=10m
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  contract-tests:
    name: rclone contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - run: ./tools/test-rclone-contract.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=$(./tools/version.sh suffix)
          go build -buildvcs=false -trimpath -tags noselfupdate \
            -ldflags "-s -w -X github.com/rclone/rclone/fs.VersionSuffix=$suffix" \
            -o /tmp/rclone-123pan ./cmd/rclone-123pan

  debian-package:
    name: Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_METADATA: ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - name: Install packaging tools
        run: |
          if ! command -v zip >/dev/null 2>&1 || ! command -v dpkg-deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zip dpkg
          fi
      - name: Build release artifacts and Debian packages
        run: ./tools/build-alpha.sh
      - name: Validate Debian packages
        run: ./tools/test-deb-packages.sh dist
      - name: Install and remove amd64 Debian package
        run: |
          product_version=$(./tools/version.sh product)
          package="dist/rclone-123pan_${product_version}_linux_amd64.deb"
          sudo dpkg --install "$package"
          test "$(dpkg-query --show --showformat='${Package}' rclone-123pan)" = "rclone-123pan"
          /usr/bin/rclone-123pan version
          sudo dpkg --remove rclone-123pan
          test ! -e /usr/bin/rclone-123pan
