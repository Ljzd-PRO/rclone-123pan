name: Build Artifacts

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_metadata:
        description: Optional SemVer build metadata; leave empty to generate a CI identifier
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - name: Install packaging tools
        run: |
          if ! command -v zip >/dev/null 2>&1 || ! command -v dpkg-deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zip dpkg
          fi
      - name: Resolve build metadata
        id: version
        env:
          INPUT_METADATA: ${{ inputs.build_metadata }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_METADATA" ]; then
            metadata=$INPUT_METADATA
          else
            short_sha=$(git rev-parse --short=12 HEAD)
            metadata="ci.${GITHUB_RUN_NUMBER}.${short_sha}"
          fi
          product_version=$(BUILD_METADATA=$metadata ./tools/version.sh product)
          {
            echo "metadata=$metadata"
            echo "product_version=$product_version"
          } >> "$GITHUB_OUTPUT"
      - name: Build reproducible artifacts
        env:
          BUILD_METADATA: ${{ steps.version.outputs.metadata }}
        run: ./tools/build-alpha.sh
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Validate Debian packages
        env:
          BUILD_METADATA: ${{ steps.version.outputs.metadata }}
        run: ./tools/test-deb-packages.sh dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rclone_${{ steps.version.outputs.product_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
