name: Build Artifacts

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      plugin_version:
        description: Artifact version without the pinned rclone version; leave empty to generate one
        required: false
        default: 0.1.0-alpha.1

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: true
      - name: Install packaging tools
        run: |
          if ! command -v zip >/dev/null 2>&1 || ! command -v dpkg-deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zip dpkg
          fi
      - name: Resolve build version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.plugin_version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          else
            short_sha=$(git rev-parse --short=12 HEAD)
            version="0.0.0-alpha.${GITHUB_RUN_NUMBER}.${short_sha}"
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9][0-9A-Za-z._+-]*$'; then
            echo "非法构建版本：$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build reproducible artifacts
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/build-alpha.sh
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Validate Debian packages
        run: ./tools/test-deb-packages.sh dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rclone-123pan_${{ steps.version.outputs.version }}_rclone-v1.75.0
          path: dist/
          if-no-files-found: error
          retention-days: 7
