name: Internal alpha artifacts

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: Internal alpha version (without rclone pin)
        required: true
        default: 0.1.0-alpha.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true
      - name: Build reproducible internal alpha set
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: ./tools/build-alpha.sh
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rclone-123pan_${{ inputs.plugin_version }}_rclone-v1.75.0
          path: dist/
          if-no-files-found: error
          retention-days: 7
